services:
  - type: web_service
    name: NyayaFlow AI Backend
    env: python
    region: oregon
    plan: starter
    branch: main
    root: backend
    runtime: python-3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: mistral
      - key: LLM_MODEL
        value: mistral-small-latest
      - key: LLM_BASE_URL
        value: https://api.mistral.ai/v1/chat/completions
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-url.vercel.app
      - key: UPLOADS_DIR
        value: uploads
    
    autoDeploy: true
